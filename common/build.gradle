plugins {
    id 'java-library'
    id 'jacoco'
    id 'info.solidsoft.pitest'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_version))
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = rootProject.jacoco_version
}

def coverageGateClasses = [
        'dev/blocklens/core/CapabilityId*.class',
        'dev/blocklens/core/BlockLensConfig*.class',
        'dev/blocklens/core/BlockLensConfigCodec*.class',
        'dev/blocklens/core/state/SemanticState*.class',
        'dev/blocklens/core/state/DecorationStateKind*.class',
        'dev/blocklens/core/state/TargetCapabilityIndex*.class',
        'dev/blocklens/core/render/DecorationVisualCue*.class',
        'dev/blocklens/core/render/DecorationRenderDescriptor*.class',
        'dev/blocklens/core/render/DecorationRenderPolicy*.class',
        'dev/blocklens/core/render/DecorationTargetCatalog*.class',
        'dev/blocklens/core/render/DecorationQuadFace*.class',
        'dev/blocklens/core/render/DecorationQuadInstruction*.class',
        'dev/blocklens/core/render/DecorationQuadCuePolicy*.class'
]

def coverageGateClassDirectories = providers.provider {
    files(sourceSets.main.output.classesDirs.collect { classesDir ->
        fileTree(dir: classesDir, include: coverageGateClasses)
    })
}

jacocoTestReport {
    dependsOn tasks.named('test')
    classDirectories.setFrom(coverageGateClassDirectories)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(coverageGateClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(rootProject.quality_line_threshold)
            }
        }
    }
}

pitest {
    targetClasses = [
            'dev.blocklens.core.CapabilityId',
            'dev.blocklens.core.BlockLensConfig',
            'dev.blocklens.core.BlockLensConfigCodec',
            'dev.blocklens.core.state.SemanticState',
            'dev.blocklens.core.state.DecorationStateKind',
            'dev.blocklens.core.state.TargetCapabilityIndex',
            'dev.blocklens.core.render.DecorationVisualCue',
            'dev.blocklens.core.render.DecorationRenderDescriptor',
            'dev.blocklens.core.render.DecorationRenderPolicy',
            'dev.blocklens.core.render.DecorationQuadInstruction',
            'dev.blocklens.core.render.DecorationQuadCuePolicy'
    ]
    // Mutation tests intentionally exclude repository/filesystem contract tests and the
    // large exact M0 target-data table; deterministic product-policy logic remains mutation-gated.
    targetTests = [
            'dev.blocklens.core.CapabilityIdTest',
            'dev.blocklens.core.BlockLensConfigCodecTest',
            'dev.blocklens.core.state.SemanticStateTest',
            'dev.blocklens.core.state.DecorationStateKindTest',
            'dev.blocklens.core.state.TargetCapabilityIndexTest',
            'dev.blocklens.core.render.DecorationRenderPolicyTest',
            'dev.blocklens.core.render.DecorationQuadCuePolicyTest'
    ]
    junit5PluginVersion = '1.2.3'
    threads = 2
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    failWhenNoMutations = true
    mutationThreshold = Integer.parseInt(rootProject.quality_mutation_threshold)
    coverageThreshold = Integer.parseInt(rootProject.quality_coverage_threshold)
    testStrengthThreshold = Integer.parseInt(rootProject.quality_test_strength_threshold)
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Shared BlockLens semantic/config/render-policy quality gate.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('pitest')
}
