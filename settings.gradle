pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        // Google's mirror of Maven Central first: Central's CDN rate-limits CI runners (429) and has
        // answered 404 for valid artifacts; Central itself is the fallback (knowledge/current/ci-release.md).
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = 'BlockLens'

include 'common'
include 'versions:mc26_1_2'
include 'versions:mc26_2'
include 'versions:mc26_3'

project(':versions:mc26_1_2').projectDir = file('versions/mc26_1_2')
project(':versions:mc26_2').projectDir = file('versions/mc26_2')
project(':versions:mc26_3').projectDir = file('versions/mc26_3')
