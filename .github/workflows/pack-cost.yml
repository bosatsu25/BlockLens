name: Pack cost comparison
on:
  workflow_call:
permissions:
  contents: read
jobs:
  # Source-pack structural twin vs BlockLens on every supported line
  # (knowledge/current/pack-cost-comparison.md). Fails only on an invalid measurement.
  pack-cost:
    name: ${{ matrix.minecraft }} / pack vs BlockLens cost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: mc26_1_2, minecraft: '26.1.2'}
          - {module: mc26_2, minecraft: '26.2'}
          - {module: mc26_3, minecraft: '26.3'}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      SDL_VIDEO_FORCE_EGL: ${{ matrix.module == 'mc26_3' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.1'
          # One shared basic cache, saved only by the common gate that every Gradle job waits for
          # (knowledge/current/ci-release.md).
          cache-provider: basic
          cache-read-only: true
      - name: Install Mesa
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libgl1-mesa-dri
      - name: Generate the source-pack structural twin
        run: |
          mkdir -p build/pack-cost "build/ci/pack-cost-${{ matrix.minecraft }}"
          python3 scripts/pack_structure_twin.py generate \
            --profile scripts/source_pack_structure.jsonl.gz --out build/pack-cost/source-twin.zip
          python3 scripts/pack_structure_twin.py compare \
            --profile scripts/source_pack_structure.jsonl.gz --pack build/pack-cost/source-twin.zip \
            --report "build/ci/pack-cost-${{ matrix.minecraft }}/twin-structure.md"
      - name: Measure pack and BlockLens cost
        timeout-minutes: 20
        run: >-
          xvfb-run -a gradle --stacktrace -PverifyPackagedRuntime=true -PclientTestFocus=pack-cost
          -PpackCostPack=build/pack-cost/source-twin.zip
          :versions:${{ matrix.module }}:runClientGameTest
      - name: Validate and summarize the comparison
        run: >-
          python3 scripts/summarize_pack_cost.py
          --directory 'versions/${{ matrix.module }}/build/run/clientGameTest/pack-cost'
          --minecraft '${{ matrix.minecraft }}' --destination 'build/ci/pack-cost-${{ matrix.minecraft }}'
          --step-summary "$GITHUB_STEP_SUMMARY" --jfr "$JAVA_HOME/bin/jfr"
      - name: Upload the comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-pack-cost-${{ matrix.minecraft }}
          path: build/ci/pack-cost-${{ matrix.minecraft }}
          if-no-files-found: error
          retention-days: 30
      - name: Sanitize failure diagnostics
        if: failure()
        run: >-
          mkdir -p build/ci/pack-cost-failure-${{ matrix.minecraft }} &&
          python3 scripts/sanitize-client-diagnostics.py '${{ matrix.module }}'
          > build/ci/pack-cost-failure-${{ matrix.minecraft }}/log-summary.txt;
          cp -r 'versions/${{ matrix.module }}/build/run/clientGameTest/pack-cost'
          build/ci/pack-cost-failure-${{ matrix.minecraft }}/ 2>/dev/null || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-pack-cost-failure-${{ matrix.minecraft }}
          path: build/ci/pack-cost-failure-${{ matrix.minecraft }}
          if-no-files-found: error
          retention-days: 14
