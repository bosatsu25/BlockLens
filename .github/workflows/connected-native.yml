name: Connected ore native
on:
  workflow_call:
permissions:
  contents: read
jobs:
  connected-native:
    name: ${{ matrix.minecraft }} / connected ore native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: mc26_1_2, minecraft: '26.1.2'}
          - {module: mc26_2, minecraft: '26.2'}
          - {module: mc26_3, minecraft: '26.3'}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      SDL_VIDEO_FORCE_EGL: ${{ matrix.module == 'mc26_3' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Mesa
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1 libgl1-mesa-dri
      - name: Test packaged connected ore rendering
        timeout-minutes: 14
        run: >-
          xvfb-run -a gradle --stacktrace -PverifyPackagedRuntime=true -PclientTestFocus=connected
          :versions:${{ matrix.module }}:runClientGameTest
      - name: Verify the complete connected graph
        run: >-
          python3 scripts/verify_connected_evidence.py
          --directory 'versions/${{ matrix.module }}/build/run/clientGameTest/connected-visual'
          --minecraft '${{ matrix.minecraft }}' --destination 'build/ci/connected-native-${{ matrix.minecraft }}'
      - name: Upload verified connected evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-connected-native-${{ matrix.minecraft }}
          path: build/ci/connected-native-${{ matrix.minecraft }}
          if-no-files-found: error
          retention-days: 14
      - name: Sanitize failure diagnostics
        if: failure()
        run: >-
          mkdir -p build/ci/connected-native-failure-${{ matrix.minecraft }} &&
          python3 scripts/sanitize-client-diagnostics.py '${{ matrix.module }}'
          > build/ci/connected-native-failure-${{ matrix.minecraft }}/log-summary.txt
      - name: Preserve bounded failed frames
        if: failure()
        run: >-
          python3 scripts/verify_external_compatibility.py --failed-run
          --directory 'versions/${{ matrix.module }}/build/run/clientGameTest'
          --minecraft '${{ matrix.minecraft }}' --profile shader-off
          --destination 'build/ci/connected-native-failure-${{ matrix.minecraft }}/rendered'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-connected-native-failure-${{ matrix.minecraft }}
          path: build/ci/connected-native-failure-${{ matrix.minecraft }}
          if-no-files-found: error
          retention-days: 14
