name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocklens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-quality:
    name: common / JUnit + JaCoCo + PIT
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run shared quality gate
        run: gradle --stacktrace :common:qualityGate

  version-build:
    name: ${{ matrix.minecraft }} / build + client smoke + budget
    needs: common-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mc26_1_2
            minecraft: '26.1.2'
          - module: mc26_2
            minecraft: '26.2'
          - module: mc26_3
            minecraft: '26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and verify Minecraft ${{ matrix.minecraft }}
        run: >-
          gradle --stacktrace
          :versions:${{ matrix.module }}:build
          :versions:${{ matrix.module }}:versionSmokeContract
          :versions:${{ matrix.module }}:verifyRuntimeJarBudget
      - name: Verify reproducible runtime JAR Minecraft ${{ matrix.minecraft }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="versions/${{ matrix.module }}/build/libs"
          mapfile -t first_candidates < <(find "$runtime_dir" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print)
          if [[ "${#first_candidates[@]}" -ne 1 ]]; then
            echo "Expected one first-build runtime JAR, found ${#first_candidates[@]}" >&2
            printf '%s\n' "${first_candidates[@]}" >&2
            exit 1
          fi
          first_sha="$(sha256sum "${first_candidates[0]}" | cut -d' ' -f1)"
          gradle --stacktrace :common:clean :versions:${{ matrix.module }}:clean :versions:${{ matrix.module }}:build
          mapfile -t second_candidates < <(find "$runtime_dir" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print)
          if [[ "${#second_candidates[@]}" -ne 1 ]]; then
            echo "Expected one second-build runtime JAR, found ${#second_candidates[@]}" >&2
            printf '%s\n' "${second_candidates[@]}" >&2
            exit 1
          fi
          second_sha="$(sha256sum "${second_candidates[0]}" | cut -d' ' -f1)"
          if [[ "$first_sha" != "$second_sha" ]]; then
            echo "Runtime JAR is not reproducible: first=$first_sha second=$second_sha" >&2
            exit 1
          fi
          echo "Reproducible runtime SHA-256: $second_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Install SDL3 EGL runtime
        if: matrix.module == 'mc26_3'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1-mesa-dri
      - name: Run client GameTest Minecraft ${{ matrix.minecraft }}
        timeout-minutes: 8
        env:
          # SDL3 uses EGL for an sRGB-capable OpenGL framebuffer under Xvfb.
          SDL_VIDEO_FORCE_EGL: ${{ matrix.module == 'mc26_3' && '1' || '0' }}
        run: >-
          xvfb-run -a gradle --stacktrace -PverifyPackagedRuntime=true
          :versions:${{ matrix.module }}:runClientGameTest
      - name: Collect failed Client GameTest diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          target="build/ci/client-gametest-failure-${{ matrix.minecraft }}"
          mkdir -p "$target"
          find "versions/${{ matrix.module }}" -type f \
            \( -path '*/logs/latest.log' -o -path '*/m3-visual/*' \
            -o -path '*/m5-dark-visual/*' -o -path '*/m5-pack-visual/*' \
            -o -path '*/m7-visual/*' -o -path '*/m8-performance/*' \
            -o -path '*/lightweight-visual/*' \) \
            -exec cp --parents '{}' "$target" \;
      - name: Upload failed Client GameTest diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-client-gametest-failure-${{ matrix.minecraft }}
          path: build/ci/client-gametest-failure-${{ matrix.minecraft }}
          if-no-files-found: warn
          retention-days: 14
      - name: Verify BlockLens model resources resolved Minecraft ${{ matrix.minecraft }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          mapfile -t logs < <(find "$source_root" -type f -path '*/logs/latest.log' -print | sort)
          if [[ "${#logs[@]}" -lt 1 ]]; then
            echo "Client GameTest latest.log was not found" >&2
            exit 1
          fi
          for log in "${logs[@]}"; do
            if grep -Fq 'Missing block model: blocklens:block/' "$log"; then
              echo "BlockLens model failed to resolve in $log" >&2
              grep -F 'Missing block model: blocklens:block/' "$log" >&2
              exit 1
            fi
            if grep -Fq 'Missing texture references in model blocklens:block/' "$log"; then
              echo "BlockLens model has incomplete texture references in $log" >&2
              grep -A2 -F 'Missing texture references in model blocklens:block/' "$log" >&2
              exit 1
            fi
          done
      - name: Collect M3 rendered visual evidence
        id: visual
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/m3-visual-${{ matrix.minecraft }}"
          rm -rf "$target"
          mkdir -p "$target"
          mapfile -t screenshots < <(find "$source_root" -type f -path '*/m3-visual/*.png' -print | sort)
          mapfile -t manifests < <(find "$source_root" -type f -path '*/m3-visual/m3-visual-manifest.txt' -print | sort)
          if [[ "${#screenshots[@]}" -ne 3 ]]; then
            echo "Expected exactly three M3 visual screenshots, found ${#screenshots[@]}" >&2
            printf '%s\n' "${screenshots[@]}" >&2
            exit 1
          fi
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one M3 visual manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          for screenshot in "${screenshots[@]}"; do cp "$screenshot" "$target/"; done
          cp "${manifests[0]}" "$target/"
          (cd "$target" && sha256sum *.png > SHA256SUMS.txt)
          echo "path=$target" >> "$GITHUB_OUTPUT"
          {
            echo "### M3 rendered visual evidence ${{ matrix.minecraft }}"
            echo '```text'
            cat "$target/m3-visual-manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M3 rendered visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-m3-visual-${{ matrix.minecraft }}
          path: ${{ steps.visual.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect settings UI visual evidence
        id: settingsvisual
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/settings-ui-${{ matrix.minecraft }}"
          mkdir -p "$target"
          mapfile -t screenshots < <(find "$source_root" -type f -path '*/settings-ui/*.png' -print | sort)
          if [[ "${#screenshots[@]}" -ne 10 ]]; then
            echo "Expected exactly ten settings UI screenshots, found ${#screenshots[@]}" >&2
            exit 1
          fi
          for screenshot in "${screenshots[@]}"; do cp "$screenshot" "$target/"; done
          for locale in en_us ja_jp; do
            for category in decoration resource outline other compact; do
              test -s "$target/settings-$locale-$category.png"
            done
          done
          (cd "$target" && sha256sum *.png > SHA256SUMS.txt)
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "### Settings UI: both languages, four categories and compact size" >> "$GITHUB_STEP_SUMMARY"
          # Controlled settings-only frames, readable through the GitHub connector's text-log API.
          for locale in en_us ja_jp; do
            for category in decoration resource outline other compact; do
              echo "BLOCKLENS_SETTINGS_IMAGE_BEGIN:$locale:$category"
              base64 -w 120 "$target/settings-$locale-$category.png"
              echo "BLOCKLENS_SETTINGS_IMAGE_END"
            done
          done
      - name: Upload settings UI visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-settings-ui-${{ matrix.minecraft }}
          path: ${{ steps.settingsvisual.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect M5 dark-area visual evidence
        id: m5visual
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/m5-dark-visual-${{ matrix.minecraft }}"
          rm -rf "$target"
          mkdir -p "$target"
          mapfile -t screenshots < <(find "$source_root" -type f -path '*/m5-dark-visual/*.png' -print | sort)
          mapfile -t manifests < <(find "$source_root" -type f -path '*/m5-dark-visual/m5-dark-visual-manifest.txt' -print | sort)
          if [[ "${#screenshots[@]}" -ne 2 ]]; then
            echo "Expected exactly two M5 dark-area screenshots, found ${#screenshots[@]}" >&2
            printf '%s\n' "${screenshots[@]}" >&2
            exit 1
          fi
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one M5 dark-area visual manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          for screenshot in "${screenshots[@]}"; do cp "$screenshot" "$target/"; done
          cp "${manifests[0]}" "$target/"
          (cd "$target" && sha256sum *.png > SHA256SUMS.txt)
          echo "path=$target" >> "$GITHUB_OUTPUT"
          {
            echo "### M5 dark-area visual evidence ${{ matrix.minecraft }}"
            echo '```text'
            cat "$target/m5-dark-visual-manifest.txt"
            echo '```'
            echo "- Screenshots: \`2\`"
            echo "- Screenshot SHA-256 manifest: \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M5 dark-area visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-m5-dark-visual-${{ matrix.minecraft }}
          path: ${{ steps.m5visual.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect M5 active resource-pack evidence
        id: m5pack
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/m5-pack-visual-${{ matrix.minecraft }}"
          rm -rf "$target"
          mkdir -p "$target"
          mapfile -t screenshots < <(find "$source_root" -type f -path '*/m5-pack-visual/*.png' -print | sort)
          mapfile -t manifests < <(find "$source_root" -type f -path '*/m5-pack-visual/m5-pack-visual-manifest.txt' -print | sort)
          if [[ "${#screenshots[@]}" -ne 3 ]]; then
            echo "Expected exactly three M5 active-pack screenshots, found ${#screenshots[@]}" >&2
            printf '%s\n' "${screenshots[@]}" >&2
            exit 1
          fi
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one M5 active-pack visual manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          for screenshot in "${screenshots[@]}"; do cp "$screenshot" "$target/"; done
          cp "${manifests[0]}" "$target/"
          (cd "$target" && sha256sum *.png > SHA256SUMS.txt)
          echo "path=$target" >> "$GITHUB_OUTPUT"
          {
            echo "### M5 active resource-pack evidence ${{ matrix.minecraft }}"
            echo '```text'
            cat "$target/m5-pack-visual-manifest.txt"
            echo '```'
            echo "- Screenshots: \`3\`"
            echo "- Screenshot SHA-256 manifest: \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M5 active resource-pack evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-m5-pack-visual-${{ matrix.minecraft }}
          path: ${{ steps.m5pack.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect M7 full parity visual evidence
        id: m7visual
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/m7-visual-${{ matrix.minecraft }}"
          rm -rf "$target"
          mkdir -p "$target"
          mapfile -t screenshots < <(find "$source_root" -type f -path '*/m7-visual/*.png' -print | sort)
          mapfile -t manifests < <(find "$source_root" -type f -path '*/m7-visual/m7-visual-manifest.txt' -print | sort)
          if [[ "${#screenshots[@]}" -ne 5 ]]; then
            echo "Expected exactly five M7 visual screenshots, found ${#screenshots[@]}" >&2
            printf '%s\n' "${screenshots[@]}" >&2
            exit 1
          fi
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one M7 visual manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          for screenshot in "${screenshots[@]}"; do cp "$screenshot" "$target/"; done
          cp "${manifests[0]}" "$target/"
          (cd "$target" && sha256sum *.png > SHA256SUMS.txt)
          echo "path=$target" >> "$GITHUB_OUTPUT"
          {
            echo "### M7 full parity evidence ${{ matrix.minecraft }}"
            echo '```text'
            cat "$target/m7-visual-manifest.txt"
            echo '```'
            echo "- Screenshots: \`5\`"
            echo "- Screenshot SHA-256 manifest: \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M7 full parity visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-m7-visual-${{ matrix.minecraft }}
          path: ${{ steps.m7visual.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect M8 performance observation
        id: m8perf
        shell: bash
        run: |
          set -euo pipefail
          source_root="versions/${{ matrix.module }}"
          target="build/ci/m8-performance-${{ matrix.minecraft }}"
          rm -rf "$target"
          mkdir -p "$target"
          mapfile -t manifests < <(find "$source_root" -type f -path '*/m8-performance/m8-performance-baseline.txt' -print | sort)
          if [[ "${#manifests[@]}" -ne 1 ]]; then
            echo "Expected exactly one M8 performance manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          cp "${manifests[0]}" "$target/"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          {
            echo "### M8 performance observation ${{ matrix.minecraft }}"
            echo '```text'
            cat "$target/m8-performance-baseline.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M8 performance observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-m8-performance-${{ matrix.minecraft }}
          path: ${{ steps.m8perf.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect lightweight feature visual evidence
        id: lightweight
        shell: bash
        run: |
          set -euo pipefail
          root="versions/${{ matrix.module }}/build/run/clientGameTest/lightweight-visual"
          test -f "$root/lightweight-visual-manifest.txt"
          test "$(find "$root" -maxdepth 1 -name '*.png' | wc -l)" -eq 32
          grep -q '^all46Enabled=true$' "$root/lightweight-visual-manifest.txt"
          grep -q '^all46Reload=true$' "$root/lightweight-visual-manifest.txt"
          grep -q '^all46FireAndBothHands=true$' "$root/lightweight-visual-manifest.txt"
          echo "path=$root" >> "$GITHUB_OUTPUT"
      - name: Upload lightweight feature visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-lightweight-visual-${{ matrix.minecraft }}
          path: ${{ steps.lightweight.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Resolve runtime artifact
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "versions/${{ matrix.module }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one runtime JAR, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          mkdir -p build/ci
          target="build/ci/blocklens-${{ matrix.minecraft }}.jar"
          cp "${jars[0]}" "$target"
          bytes="$(stat -c%s "$target")"
          sha256="$(sha256sum "$target" | cut -d' ' -f1)"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### BlockLens ${{ matrix.minecraft }}"
            echo "- Runtime JAR: \`$bytes bytes\`"
            echo "- SHA-256: \`$sha256\`"
            echo "- Client GameTest: \`PASS\`"
            echo "- BlockLens model resolution: \`PASS\`"
            echo "- M3 rendered visual evidence: \`PASS\`"
            echo "- M5 dark-area visual evidence: \`PASS\`"
            echo "- M5 active resource-pack evidence: \`PASS\`"
            echo "- M7 all-40 full parity evidence: \`PASS\`"
            echo "- Lightweight features and all-46 reload evidence: \`PASS\`"
            echo "- M8 performance observation: \`PASS\`"
            echo "- Reproducible artifact: \`PASS\`"
            echo "- Privacy/residue audit: \`PASS\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified runtime JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocklens-${{ matrix.minecraft }}
          path: ${{ steps.runtime.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
