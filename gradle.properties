# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.warning.mode=all

# Toolchain
java_version=25
gradle_version=9.5.1
loom_version=1.17.19
loader_version=0.19.3

# Minecraft / Fabric API
minecraft_26_1_2=26.1.2
fabric_api_26_1_2=0.155.2+26.1.2
modmenu_26_1_2=18.0.0
minecraft_26_2=26.2
fabric_api_26_2=0.160.0+26.2
modmenu_26_2=20.0.1

# Project
# v0.1.0 is the published 37-capability AMATERAS baseline. P0 shipped in v0.2.0;
# v0.2.1 is the backward-compatible runtime/settings hardening release.
# v0.2.2 adds the missing optional Mod Menu configuration entry point.
mod_version=0.2.2
maven_group=dev.blocklens
archives_base_name=blocklens

# Test quality gates
jacoco_version=0.8.15
quality_line_threshold=0.96
quality_coverage_threshold=96
quality_mutation_threshold=96
quality_test_strength_threshold=96

# Runtime artifact budgets — each supported Minecraft JAR is checked independently.
# Pinned AMATERAS source pack: 2,366,865 B. The absolute product requirement is below 50%.
runtime_jar_source_pack_bytes=2366865
runtime_jar_hard_max_bytes=1183432
# M8 pre-icon baseline: 88,973 B. M9/v0.1.0 release icon baseline: 95,333 B.
# Published v0.2.0 artifacts are 96,248 B on both Minecraft lines; the release-era
# cross-platform no-growth baseline was 96,257 B.
# Post-v0.2.0 stability/performance review measurement (2026-09-14):
# local: 101,877 B (26.1.2) / 101,913 B (26.2)
# Linux PR CI #273 / 34820789320 at ee3a0b49: 101,854 B / 101,890 B.
# The reviewed growth adds the bounded responsive settings UI, crash-safe config persistence,
# and hot-path/retained-array reductions. Freeze the larger reviewed local value; the 100 KiB
# release budget stays unchanged until measured v0.2.2 evidence says otherwise.
runtime_jar_baseline_bytes=101913
# BlockLens release budget. Intentional growth still requires an explicit reviewed baseline update.
runtime_jar_release_budget_bytes=102400
