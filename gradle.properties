# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.warning.mode=all
# Dependency downloads. Gradle 9.5.1 defaults to 30 s connect/read timeouts and 3 tentatives with a
# 1 s initial backoff, then disables the repository for the build; maven.fabricmc.net reads exceeded
# that in hosted CI on 2026-10-28 (knowledge/current/ci-release.md).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Toolchain
java_version=25
gradle_version=9.5.1
loom_version=1.17.19
loader_version=0.19.5

# Minecraft / Fabric API
minecraft_26_1_2=26.1.2
fabric_api_26_1_2=0.155.2+26.1.2
minecraft_26_2=26.2
fabric_api_26_2=0.160.0+26.2
minecraft_26_3=26.3
fabric_api_26_3=0.162.0+26.3

# Optional UI integration
modmenu_version=18.0.0

# Project
# v0.1.0 is the published 37-capability source baseline. P0 shipped in v0.2.0;
# v0.2.1 is the backward-compatible runtime/settings hardening release.
# v0.2.2 adds the missing Mod Menu settings entrypoint while keeping Mod Menu optional.
# v0.3.0 shipped 57 capabilities across Minecraft 26.1.2, 26.2 and 26.3.
# v0.4.0 keeps 55 after retiring two tools and adds opt-in source-pack profiles.
# v0.4.1 repairs optimized BBE closed-chest rendering without disabling BBE.
# v0.4.2 adds the native pale-oak palette and verified resource-reload UI gates.
# v0.4.3 adds independently controlled native compact model displays.
# v0.4.5 adds independent connected ore borders while preserving native terrain simplification.
mod_version=0.4.7
maven_group=dev.blocklens
archives_base_name=blocklens

# Test quality gates
jacoco_version=0.8.15
quality_line_threshold=0.96
quality_coverage_threshold=96
quality_mutation_threshold=96
quality_test_strength_threshold=96

# Runtime artifact budgets — each supported Minecraft JAR is checked independently.
# Pinned source pack: 2,366,865 B. The absolute source-pack requirement remains below 50%.
runtime_jar_source_pack_bytes=2366865
runtime_jar_hard_max_bytes=1183432
# v0.2.1 shipped at 101,854 B (26.1.2) / 101,890 B (26.2).
# The user-facing product ceiling is now 250 KiB, explicitly authorized on 2026-10-27 for the
# pack-level decoration decal layer (knowledge/current/pack-information-parity.md).
# The development and release gates use that same accepted ceiling. The previous 200 KiB
# (2026-10-11) and historical 140/150 KiB gates remain in prior evidence; see
# knowledge/current/remaining-delivery.md. The absolute ceiling is unchanged.
runtime_jar_baseline_bytes=256000
runtime_jar_release_budget_bytes=256000
