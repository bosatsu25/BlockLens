java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_version))
    }
    withSourcesJar()
}

version = "${rootProject.mod_version}+mc${blockLensMinecraftVersion}"
base {
    archivesName = "${rootProject.archives_base_name}-${blockLensMinecraftVersion}"
}

def blockLensArtifactVersion = project.version.toString()
def blockLensMinecraftVersionValue = blockLensMinecraftVersion.toString()
def blockLensLoaderVersionValue = rootProject.loader_version.toString()
def runtimeHardMaxBytes = Long.parseLong(rootProject.runtime_jar_hard_max_bytes.toString())
def runtimeStretchBytes = Long.parseLong(rootProject.runtime_jar_stretch_bytes.toString())

dependencies {
    minecraft "com.mojang:minecraft:${blockLensMinecraftVersionValue}"
    implementation "net.fabricmc:fabric-loader:${blockLensLoaderVersionValue}"
    implementation "net.fabricmc.fabric-api:fabric-api:${blockLensFabricApiVersion}"
    implementation project(':common')

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'blocklens-gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

sourceSets {
    gametest {
        java.srcDir rootProject.file('gametest/java')
        resources.srcDir rootProject.file('gametest/resources')
    }
}

processResources {
    inputs.property 'version', blockLensArtifactVersion
    inputs.property 'minecraft_version', blockLensMinecraftVersionValue
    inputs.property 'loader_version', blockLensLoaderVersionValue
    filesMatching('fabric.mod.json') {
        expand(
                version: blockLensArtifactVersion,
                minecraft_version: blockLensMinecraftVersionValue,
                loader_version: blockLensLoaderVersionValue)
    }
}

tasks.named('jar') {
    dependsOn project(':common').tasks.named('classes')
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude '**/*Test.class', '**/test/**'
}

tasks.named('sourcesJar') {
    from(project(':common').sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Loom 1.17 can operate in either remapping or non-remapping mode depending on
// the target Minecraft line. In remapping mode the distributable artifact is
// remapJar; in non-remapping mode Loom deliberately uses jar directly.
def runtimeJarTask = tasks.findByName('remapJar') != null
        ? tasks.named('remapJar')
        : tasks.named('jar')

tasks.register('versionSmokeContract') {
    group = 'verification'
    description = "Checks the ${blockLensMinecraftVersionValue} runtime artifact structure, metadata, privacy, and residue."
    dependsOn runtimeJarTask

    doLast {
        File runtimeJar = runtimeJarTask.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(runtimeJar).withCloseable { archive ->
            for (String required : [
                    'fabric.mod.json',
                    'dev/blocklens/fabric/BlockLensClient.class',
                    'dev/blocklens/fabric/MinecraftStateAdapter.class',
                    'dev/blocklens/fabric/MinecraftDecorationTargetIndex.class',
                    'dev/blocklens/fabric/MinecraftDecorationModelPlugin.class',
                    'dev/blocklens/fabric/MinecraftDecorationModel.class',
                    'dev/blocklens/core/CapabilityId.class',
                    'dev/blocklens/core/BlockLensConfig.class',
                    'dev/blocklens/core/state/SemanticState.class',
                    'dev/blocklens/core/state/DecorationStateKind.class',
                    'dev/blocklens/core/render/DecorationRenderDescriptor.class',
                    'dev/blocklens/core/render/DecorationRenderPolicy.class',
                    'dev/blocklens/core/render/DecorationTargetCatalog.class',
                    'dev/blocklens/core/render/DecorationQuadCuePolicy.class',
                    'assets/blocklens/lang/en_us.json',
                    'assets/blocklens/lang/ja_jp.json']) {
                if (archive.getEntry(required) == null) {
                    throw new GradleException("Runtime JAR missing required entry: ${required}")
                }
            }

            String metadata = archive.getInputStream(archive.getEntry('fabric.mod.json')).getText('UTF-8')
            if (!metadata.contains('"environment": "client"')) {
                throw new GradleException('fabric.mod.json must remain client-only')
            }
            if (!metadata.contains("\"minecraft\": \"=${blockLensMinecraftVersionValue}\"")) {
                throw new GradleException("fabric.mod.json is not pinned to Minecraft ${blockLensMinecraftVersionValue}")
            }

            List entries = archive.entries().toList().findAll { !it.directory }
            if (entries.any { entry -> entry.name.endsWith('.jar') }) {
                throw new GradleException('Runtime JAR must not contain nested dependency JARs')
            }

            List<String> forbiddenNames = [
                    '.DS_Store',
                    'Thumbs.db',
                    '.env',
                    '.log',
                    '.jfr',
                    '.hprof',
                    'crash-reports/',
                    'logs/',
                    'saves/',
                    'screenshots/',
                    '.git/',
                    '.idea/',
                    '.vscode/',
                    'respackopts.json5',
                    '.rpo'
            ]
            List<String> forbiddenPayloadMarkers = [
                    '/home/runner/work/',
                    'C:\\Users\\',
                    '/Users/',
                    'github_pat_',
                    '-----BEGIN PRIVATE KEY-----'
            ]

            for (def entry : entries) {
                String entryName = entry.name
                if (forbiddenNames.any { marker -> entryName.contains(marker) }) {
                    throw new GradleException("Runtime JAR contains forbidden residue entry: ${entryName}")
                }

                byte[] bytes = archive.getInputStream(entry).withCloseable { stream -> stream.readAllBytes() }
                String payload = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                String leaked = forbiddenPayloadMarkers.find { marker -> payload.contains(marker) }
                if (leaked != null) {
                    throw new GradleException("Runtime JAR entry ${entryName} contains forbidden private/local marker: ${leaked}")
                }
            }
        }
    }
}

tasks.register('verifyRuntimeJarBudget') {
    group = 'verification'
    description = "Checks BlockLens ${blockLensMinecraftVersionValue} runtime JAR against the source-pack size budget."
    dependsOn runtimeJarTask

    doLast {
        File runtimeJar = runtimeJarTask.get().archiveFile.get().asFile
        long bytes = runtimeJar.length()
        logger.lifecycle(
                'BlockLens {} runtime JAR: {} bytes (hard < {}, stretch <= {})',
                blockLensMinecraftVersionValue,
                bytes,
                runtimeHardMaxBytes + 1L,
                runtimeStretchBytes)

        if (bytes > runtimeStretchBytes) {
            logger.lifecycle('Largest compressed runtime entries:')
            new java.util.zip.ZipFile(runtimeJar).withCloseable { archive ->
                archive.entries().toList()
                        .findAll { !it.directory }
                        .sort { left, right -> Long.compare(right.compressedSize, left.compressedSize) }
                        .take(12)
                        .each { entry ->
                            logger.lifecycle('  {} bytes compressed / {} raw  {}', entry.compressedSize, entry.size, entry.name)
                        }
            }
        }

        if (bytes > runtimeHardMaxBytes) {
            throw new GradleException(
                    "BlockLens ${blockLensMinecraftVersionValue} runtime JAR is ${bytes} bytes; hard maximum is ${runtimeHardMaxBytes} bytes.")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('versionSmokeContract')
    dependsOn tasks.named('verifyRuntimeJarBudget')
}
