java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_version))
    }
    withSourcesJar()
}

version = "${rootProject.mod_version}+mc${blockLensMinecraftVersion}"
base {
    archivesName = "${rootProject.archives_base_name}-${blockLensMinecraftVersion}"
}

def blockLensArtifactVersion = project.version.toString()
def blockLensMinecraftVersionValue = blockLensMinecraftVersion.toString()
def blockLensLoaderVersionValue = rootProject.loader_version.toString()
def runtimeSourcePackBytes = Long.parseLong(rootProject.runtime_jar_source_pack_bytes.toString())
def runtimeHardMaxBytes = Long.parseLong(rootProject.runtime_jar_hard_max_bytes.toString())
def runtimeBaselineBytes = Long.parseLong(rootProject.runtime_jar_baseline_bytes.toString())
def runtimeReleaseBudgetBytes = Long.parseLong(rootProject.runtime_jar_release_budget_bytes.toString())

dependencies {
    minecraft "com.mojang:minecraft:${blockLensMinecraftVersionValue}"
    implementation "net.fabricmc:fabric-loader:${blockLensLoaderVersionValue}"
    implementation "net.fabricmc.fabric-api:fabric-api:${blockLensFabricApiVersion}"
    implementation project(':common')

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'blocklens-gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Diagnostic variation applies only to the isolated client test JVM.
def m8FpsLimit = providers.gradleProperty('m8FpsLimit').orElse('60').get()
if (!(m8FpsLimit in ['30', '60', '120'])) {
    throw new GradleException('m8FpsLimit must be 30, 60 or 120')
}
def clientTestFocus = providers.gradleProperty('clientTestFocus').orElse('all').get()
if (!(clientTestFocus in ['all', 'scene', 'm8'])) {
    throw new GradleException('clientTestFocus must be all, scene or m8')
}
def m8EscapeAnalysis = providers.gradleProperty('m8EscapeAnalysis').orElse('default').get()
if (!(m8EscapeAnalysis in ['default', 'disabled'])) {
    throw new GradleException('m8EscapeAnalysis must be default or disabled')
}
def m8Compilation = providers.gradleProperty('m8Compilation').orElse('default').get()
if (!(m8Compilation in ['default', 'c1', 'c2-batch'])) {
    throw new GradleException('m8Compilation must be default, c1 or c2-batch')
}
tasks.named('runClientGameTest') {
    systemProperty 'blocklens.test.m8.fpsLimit', m8FpsLimit
    systemProperty 'blocklens.test.focus', clientTestFocus
    if (m8EscapeAnalysis == 'disabled') {
        jvmArgs '-XX:-DoEscapeAnalysis'
    }
    if (m8Compilation == 'c1') {
        jvmArgs '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=240m'
    } else if (m8Compilation == 'c2-batch') {
        jvmArgs '-XX:-TieredCompilation', '-Xbatch', '-XX:ReservedCodeCacheSize=240m'
    }
}

sourceSets {
    // Common assets must be part of the actual BlockLens Fabric resource pack during dev/GameTest.
    // The common project is a Java library, not a standalone Fabric mod, so merely putting its JAR
    // on the classpath does not make assets/blocklens visible to Minecraft's ResourceManager.
    main {
        java.srcDir rootProject.file('fabric-shared/src/main/java')
        resources.srcDir project(':common').file('src/main/resources')
    }
    gametest {
        java.srcDir rootProject.file('gametest/java')
        java.srcDir rootProject.file('test-support/java')
        resources.srcDir rootProject.file('gametest/resources')
    }
}

processResources {
    inputs.property 'version', blockLensArtifactVersion
    inputs.property 'minecraft_version', blockLensMinecraftVersionValue
    inputs.property 'loader_version', blockLensLoaderVersionValue
    filesMatching('fabric.mod.json') {
        expand(
                version: blockLensArtifactVersion,
                minecraft_version: blockLensMinecraftVersionValue,
                loader_version: blockLensLoaderVersionValue)
    }
}

tasks.named('jar') {
    dependsOn project(':common').tasks.named('classes')
    // Resource ownership stays on the outer mod; bytecode is audited in its one owned container.
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude '**/*.class', '**/test/**'
}

tasks.named('sourcesJar') {
    // Main resources already include common resources; add only the shared Java sources explicitly.
    from(project(':common').sourceSets.main.allJava)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude 'META-INF/jars/**'
}

// Loom 1.17 can operate in either remapping or non-remapping mode depending on
// the target Minecraft line. In remapping mode the distributable artifact is
// remapJar; in non-remapping mode Loom deliberately uses jar directly.
def runtimeJarTask = tasks.findByName('remapJar') != null
        ? tasks.named('remapJar')
        : tasks.named('jar')

// Exactly one owned container; compiled bytes and debug information are unchanged.
def runtimeMetadata = tasks.register('processRuntimeMetadata', Copy) {
    from rootProject.file('packaging/runtime')
    into layout.buildDirectory.dir('generated/runtime-metadata')
    inputs.property 'version', blockLensArtifactVersion
    inputs.property 'minecraft_version', blockLensMinecraftVersionValue
    inputs.property 'loader_version', blockLensLoaderVersionValue
    filesMatching('fabric.mod.json') {
        expand(version: blockLensArtifactVersion, minecraft_version: blockLensMinecraftVersionValue,
                loader_version: blockLensLoaderVersionValue)
    }
}
def runtimeContainer = tasks.register('runtimeContainerJar', Jar) {
    dependsOn tasks.named('compileJava'), project(':common').tasks.named('classes'), runtimeMetadata
    archiveFileName = 'blocklens-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('runtime-container')
    from(sourceSets.main.output.classesDirs) { include '**/*.class' }
    from(project(':common').sourceSets.main.output.classesDirs) { include '**/*.class' }
    from runtimeMetadata
    entryCompression = org.gradle.api.tasks.bundling.ZipEntryCompression.STORED
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude '**/*Test.class', '**/test/**'
}
tasks.named('processResources') {
    dependsOn runtimeContainer
    from(runtimeContainer) { into 'META-INF/jars' }
}

def verifyPackagedRuntime = providers.gradleProperty('verifyPackagedRuntime').orElse('false').get()
if (!(verifyPackagedRuntime in ['true', 'false'])) {
    throw new GradleException('verifyPackagedRuntime must be true or false')
}
if (clientTestFocus == 'm8' && verifyPackagedRuntime != 'true') {
    throw new GradleException('M8 experiments require verifyPackagedRuntime=true')
}
if (verifyPackagedRuntime == 'true') {
    tasks.named('runClientGameTest') {
        dependsOn runtimeJarTask, tasks.named('gametestClasses')
        // JavaExec finalizes its inputs before task actions; replace during configuration.
        // Copy input providers into an independent collection, retaining inferred build dependencies.
        List originalInputs = new ArrayList(((org.gradle.api.file.ConfigurableFileCollection) classpath).getFrom())
        def originalClasspath = objects.fileCollection().from(originalInputs)
        originalClasspath.builtBy(new ArrayList(((org.gradle.api.file.ConfigurableFileCollection) classpath).getBuiltBy()))
        Set<File> excluded = files(sourceSets.main.output, project(':common').sourceSets.main.output,
                project(':common').tasks.named('jar')).files.collect { it.canonicalFile }.toSet()
        File artifact = runtimeJarTask.get().archiveFile.get().asFile.canonicalFile
        def keptClasspath = originalClasspath.filter { !excluded.contains(it.canonicalFile) }
        setClasspath(files(keptClasspath, runtimeJarTask.flatMap { it.archiveFile }))
        systemProperty 'blocklens.test.packagedRuntime', 'true'
        systemProperty 'blocklens.test.expectedArtifact', artifact.absolutePath
        doFirst {
            for (File candidate : keptClasspath.files) {
                if (candidate.directory) {
                    if (new File(candidate, 'dev/blocklens/fabric/BlockLensClient.class').exists()
                            || new File(candidate, 'dev/blocklens/core/BlockLensRuntime.class').exists()) {
                        throw new GradleException('Packaged test retained development runtime bytecode')
                    }
                } else if (candidate.name.endsWith('.jar')) {
                    new java.util.zip.ZipFile(candidate).withCloseable { zip ->
                        if (zip.getEntry('dev/blocklens/fabric/BlockLensClient.class') != null
                                || zip.getEntry('dev/blocklens/core/BlockLensRuntime.class') != null) {
                            throw new GradleException('Packaged test retained a development runtime JAR')
                        }
                    }
                }
            }
        }
    }
}

apply from: rootProject.file('gradle/runtime-container-audit.gradle')
def ownedRuntimeInspector = project.ext.inspectBlockLensRuntimeContainer
def compiledRuntimeDirectories = files(sourceSets.main.output.classesDirs,
        project(':common').sourceSets.main.output.classesDirs).files.toList()

tasks.register('versionSmokeContract') {
    group = 'verification'
    description = "Checks both owned runtime archive layers, exact class bytes, metadata and privacy."
    dependsOn runtimeJarTask, tasks.named('runtimeContainerAuditContract')
    doLast {
        File runtimeJar = runtimeJarTask.get().archiveFile.get().asFile
        def audited = ownedRuntimeInspector(runtimeJar, blockLensMinecraftVersionValue,
                blockLensArtifactVersion, compiledRuntimeDirectories)
        Map<String, byte[]> inspected = new LinkedHashMap<>(audited.outer)
        audited.inner.each { name, bytes -> if (name.endsWith('.class')) inspected.put(name, bytes) }
            for (String required : [
                    'fabric.mod.json',
                    'dev/blocklens/fabric/BlockLensClient.class',
                    'dev/blocklens/fabric/BlockLensConfigScreen.class',
                    'dev/blocklens/fabric/MinecraftStateAdapter.class',
                    'dev/blocklens/fabric/MinecraftDecorationTargetIndex.class',
                    'dev/blocklens/fabric/MinecraftDecorationModelPlugin.class',
                    'dev/blocklens/fabric/MinecraftDecorationModel.class',
                    'dev/blocklens/core/CapabilityId.class',
                    'dev/blocklens/core/BlockLensConfig.class',
                    'dev/blocklens/core/state/SemanticState.class',
                    'dev/blocklens/core/state/DecorationStateKind.class',
                    'dev/blocklens/core/render/DecorationRenderDescriptor.class',
                    'dev/blocklens/core/render/DecorationTargetCatalog.class',
                    'dev/blocklens/core/render/DecorationQuadCuePolicy.class',
                    'assets/blocklens/lang/en_us.json',
                    'assets/blocklens/lang/ja_jp.json',
                    'assets/blocklens/models/block/nether/interior_fill.json',
                    'assets/blocklens/models/block/nether/upper_band.json',
                    'blocklens.mixins.json',
                    'dev/blocklens/fabric/mixin/BrightChestMixin.class',
                    'dev/blocklens/fabric/mixin/LowFireMixin.class',
                    'dev/blocklens/fabric/mixin/HandheldSizeMixin.class',
                    'assets/blocklens/models/block/lightweight/glass.json',
                    'assets/blocklens/models/block/lightweight/pane.json',
                    'assets/blocklens/models/block/lightweight/kelp.json',
                    'assets/blocklens/textures/block/lightweight/kelp.png.mcmeta',
                    'assets/blocklens/textures/entity/chest/bright_single.png',
                    'assets/blocklens/textures/entity/chest/bright_left.png',
                    'assets/blocklens/textures/entity/chest/bright_right.png']) {
                if (inspected.get(required) == null) {
                    throw new GradleException("Runtime JAR missing required entry: ${required}")
                }
            }
            for (String retired : [
                    'dev/blocklens/core/render/DecorationRenderPolicy.class',
                    'dev/blocklens/core/render/DecorationRenderPolicy$1.class',
                    'dev/blocklens/core/render/ResourceHighlightPolicy.class',
                    'dev/blocklens/core/render/VisibilityQuadCuePolicy.class']) {
                if (inspected.get(retired) != null) {
                    throw new GradleException("Runtime JAR contains retired policy bytecode: ${retired}")
                }
            }
            if (inspected.get('assets/blocklens/models/block/nether/side_fill.json') != null) {
                throw new GradleException('Runtime JAR contains retired Nether Tweaks side_fill model')
            }

    }
}

tasks.register('writeRuntimeJarSizeReport') {
    group = 'verification'
    description = "Writes deterministic M8 runtime-JAR size/category evidence for ${blockLensMinecraftVersionValue}."
    dependsOn runtimeJarTask

    def output = layout.buildDirectory.file('reports/blocklens/runtime-jar-size.txt')
    outputs.file(output)

    doLast {
        File runtimeJar = runtimeJarTask.get().archiveFile.get().asFile
        File reportFile = output.get().asFile
        reportFile.parentFile.mkdirs()

        Map<String, Long> categories = new LinkedHashMap<>()
        for (String category : [
                'core-rendering',
                'minecraft-adapter',
                'core-state',
                'core-other',
                'assets-lang',
                'assets-models',
                'owned-runtime-container',
                'metadata-other']) {
            categories.put(category, 0L)
        }

        def categoryFor = { String entryName ->
            if (entryName == 'META-INF/jars/blocklens-runtime.jar') return 'owned-runtime-container'
            if (entryName.startsWith('dev/blocklens/core/render/')) {
                return 'core-rendering'
            }
            if (entryName.startsWith('dev/blocklens/fabric/')) {
                return 'minecraft-adapter'
            }
            if (entryName.startsWith('dev/blocklens/core/state/')) {
                return 'core-state'
            }
            if (entryName.startsWith('dev/blocklens/core/')) {
                return 'core-other'
            }
            if (entryName.startsWith('assets/blocklens/lang/')) {
                return 'assets-lang'
            }
            if (entryName.startsWith('assets/blocklens/models/')) {
                return 'assets-models'
            }
            return 'metadata-other'
        }

        List entries
        new java.util.zip.ZipFile(runtimeJar).withCloseable { archive ->
            entries = archive.entries().toList().findAll { !it.directory }
            for (def entry : entries) {
                String category = categoryFor(entry.name)
                long compressed = Math.max(0L, entry.compressedSize)
                categories.put(category, categories.get(category) + compressed)
            }
        }

        long bytes = runtimeJar.length()
        def audited = ownedRuntimeInspector(runtimeJar, blockLensMinecraftVersionValue,
                blockLensArtifactVersion, compiledRuntimeDirectories)
        Map<String, Long> decodedCategories = new LinkedHashMap<>()
        audited.inner.each { name, payload ->
            String category = categoryFor(name)
            decodedCategories.put(category, decodedCategories.getOrDefault(category, 0L) + payload.length)
        }
        double sourcePercent = bytes * 100.0d / runtimeSourcePackBytes
        List<String> lines = []
        lines << "minecraft=${blockLensMinecraftVersionValue}"
        lines << "runtimeJarBytes=${bytes}"
        lines << "frozenBaselineBytes=${runtimeBaselineBytes}"
        lines << "releaseBudgetBytes=${runtimeReleaseBudgetBytes}"
        lines << "sourcePackBytes=${runtimeSourcePackBytes}"
        lines << "sourcePackHalfMaxBytes=${runtimeHardMaxBytes}"
        lines << String.format(java.util.Locale.ROOT, 'sourcePackPercent=%.3f', sourcePercent)
        lines << "entryCount=${entries.size()}"
        lines << ''
        lines << '[compressed-category-bytes]'
        categories.each { category, compressed ->
            lines << "${category}=${compressed}"
        }
        lines << ''
        lines << '[owned-container-decoded-category-bytes]'
        decodedCategories.each { category, decodedBytes -> lines << "${category}=${decodedBytes}" }
        lines << ''
        lines << '[top-compressed-entries]'
        entries.sort { left, right ->
            int bySize = Long.compare(right.compressedSize, left.compressedSize)
            bySize != 0 ? bySize : left.name <=> right.name
        }.take(20).each { entry ->
            lines << "${Math.max(0L, entry.compressedSize)}\t${Math.max(0L, entry.size)}\t${entry.name}"
        }
        reportFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('verifyRuntimeJarBudget') {
    group = 'verification'
    description = "Checks BlockLens ${blockLensMinecraftVersionValue} against the M8 source-pack, release, and no-growth budgets."
    dependsOn runtimeJarTask

    doLast {
        File runtimeJar = runtimeJarTask.get().archiveFile.get().asFile
        long bytes = runtimeJar.length()
        logger.lifecycle(
                'BlockLens {} runtime JAR: {} bytes (baseline <= {}, release <= {}, source-pack half <= {})',
                blockLensMinecraftVersionValue,
                bytes,
                runtimeBaselineBytes,
                runtimeReleaseBudgetBytes,
                runtimeHardMaxBytes)

        if (bytes > runtimeHardMaxBytes) {
            throw new GradleException(
                    "BlockLens ${blockLensMinecraftVersionValue} runtime JAR is ${bytes} bytes; source-pack half maximum is ${runtimeHardMaxBytes} bytes.")
        }
        if (bytes > runtimeReleaseBudgetBytes) {
            throw new GradleException(
                    "BlockLens ${blockLensMinecraftVersionValue} runtime JAR is ${bytes} bytes; 150 KiB release budget is ${runtimeReleaseBudgetBytes} bytes.")
        }
        if (bytes > runtimeBaselineBytes) {
            throw new GradleException(
                    "BlockLens ${blockLensMinecraftVersionValue} runtime JAR grew from the frozen M8 baseline ${runtimeBaselineBytes} to ${bytes} bytes. Reduce the artifact or deliberately rebaseline with reviewed justification; do not silently accept growth.")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('versionSmokeContract')
    dependsOn tasks.named('writeRuntimeJarSizeReport')
    dependsOn tasks.named('verifyRuntimeJarBudget')
}
